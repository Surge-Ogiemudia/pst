<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PST Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: rgba(255,255,255,0.08);
      --accent: #00d4aa;
      --accent2: #00a3ff;
      --text: #f0f6fc;
      --muted: #8b949e;
      --red: #ff4444;
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }

    .container { display: flex; flex-direction: column; height: 100vh; }

    /* ── HEADER ── */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: #000; flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-name { font-weight: 700; font-size: 13px; }
    .header-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .status-dot.online { background: var(--accent); animation: pulse 2s infinite; }
    .status-dot.offline { background: var(--red); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── CONNECTOR BANNER ── */
    .connector-banner {
      padding: 8px 14px;
      font-size: 11px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .connector-banner.connected { background: rgba(0,212,170,0.07); color: var(--accent); }
    .connector-banner.disconnected { background: rgba(255,68,68,0.07); color: var(--red); }
    .connector-banner.hidden { display: none; }

    /* ── MESSAGES ── */
    .messages {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    .msg-row { display: flex; align-items: flex-end; gap: 7px; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: #000; flex-shrink: 0;
    }
    .bubble {
      max-width: 85%; padding: 9px 12px; border-radius: 13px;
      line-height: 1.6; font-size: 12.5px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .bubble-ai { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
    .bubble-user {
      background: linear-gradient(135deg, rgba(0,212,170,.16), rgba(0,163,255,.16));
      border: 1px solid rgba(0,212,170,.22); border-bottom-right-radius: 3px;
    }

    /* ── CHIPS ── */
    .chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .chip {
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(0,212,170,.3);
      background: rgba(0,212,170,.05); color: var(--accent);
      font-size: 11.5px; font-weight: 500; cursor: pointer;
      transition: all .15s; user-select: none;
    }
    .chip:hover, .chip.selected { background: rgba(0,212,170,.18); border-color: var(--accent); }

    /* ── TYPING ── */
    .typing-indicator { display: flex; align-items: flex-end; gap: 7px; }
    .typing-bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 13px; border-bottom-left-radius: 3px;
      padding: 11px 14px; display: flex; gap: 4px; align-items: center;
    }
    .typing-dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2){animation-delay:.2s} .typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-5px);opacity:1} }

    /* ── INPUT ── */
    .input-area {
      padding: 10px 14px; background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
    }
    textarea {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 12.5px; padding: 8px 12px; resize: none;
      min-height: 36px; max-height: 90px; outline: none;
      transition: border-color .2s; line-height: 1.5;
    }
    textarea:focus { border-color: rgba(0,212,170,.4); }
    textarea::placeholder { color: var(--muted); }
    .send-btn {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .2s;
    }
    .send-btn:hover { transform: scale(1.06); box-shadow: 0 3px 14px rgba(0,212,170,.3); }
    .send-btn:active { transform: scale(.94); }

    /* ── STATUS BAR ── */
    .status-bar {
      padding: 5px 14px; background: rgba(0,212,170,.05);
      border-top: 1px solid rgba(0,212,170,.1);
      font-size: 11px; color: var(--accent);
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="avatar">P</div>
    <div class="header-info">
      <div class="header-name">PST Assistant</div>
      <div class="header-status" id="headerStatus">
        <div class="status-dot" id="headerDot"></div>
        <span id="headerStatusText">Checking connector...</span>
      </div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;">PST v1.0</div>
  </div>

  <!-- CONNECTOR BANNER -->
  <div class="connector-banner hidden" id="connectorBanner">
    <span id="connectorBannerText"></span>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages"></div>

  <!-- STATUS BAR -->
  <div class="status-bar" id="statusBar" style="display:none">
    <div class="status-dot online"></div>
    <span id="statusText"></span>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>
<script src="sidepanel.js"></script>
</body>
</html>
